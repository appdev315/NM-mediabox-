<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https: https://static.cloudflareinsights.com; frame-src 'self' https:; media-src 'self' https: data: blob:; font-src 'self' data: https:;">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MediaBox" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://evro90-nm6.hf.space" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 1. Purge legacy Service Workers and stale CacheStorage
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }

      // 2. Watchdog: Auto-heal PWA blank screen from stale chunk hashes or failed network (Strict 1-attempt guard against loops)
      (function() {
        var MAX_WAIT_MS = 8000;
        var ATTEMPT_KEY = 'mb_pwa_heal_attempts';
        var attempts = Number(sessionStorage.getItem(ATTEMPT_KEY) || '0');

        function healOnce() {
          if (attempts < 1) {
            sessionStorage.setItem(ATTEMPT_KEY, String(attempts + 1));
            window.location.reload();
          } else {
            var root = document.getElementById('root');
            if (root && (!root.firstElementChild || root.children.length === 0)) {
              root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background-color:#0b0f19;color:#f5f5f5;font-family:-apple-system,sans-serif;padding:24px;text-align:center;"><div style="font-size:48px;margin-bottom:16px;">🍿</div><h2 style="font-size:18px;font-weight:700;margin-bottom:8px;">MediaBox</h2><p style="font-size:13px;opacity:0.7;max-width:320px;margin-bottom:20px;">Не удалось обновить ресурсы. Проверьте соединение с интернетом.</p><button onclick="sessionStorage.removeItem(\'' + ATTEMPT_KEY + '\');window.location.reload();" style="padding:10px 24px;border-radius:12px;background-color:#5288c1;color:#ffffff;font-weight:600;font-size:14px;border:none;cursor:pointer;">Повторить попытку</button></div>';
            }
          }
        }

        window.addEventListener('error', function(event) {
          var target = event.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            healOnce();
          }
        }, true);

        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.children.length === 0)) {
            healOnce();
          }
        }, MAX_WAIT_MS);
      })();
    </script>
  </body>
</html>
