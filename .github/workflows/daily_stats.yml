name: 3-Hour Server Stats & Diagnostics

on:
  schedule:
    # Run every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC) -> 8 times per 24 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  send_stats:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Stats from API
        id: fetch_stats
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${BOT_TOKEN}" https://evro90-nm6.hf.space/api/stats?reset=true)
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to fetch stats, status code: $HTTP_STATUS"
            echo "ERROR_MSG=⚠️ Не удалось получить статистику с сервера (Код $HTTP_STATUS)" >> $GITHUB_ENV
          else
            UPTIME=$(echo "$BODY" | jq -r '.uptime_seconds // 0')
            TOTAL=$(echo "$BODY" | jq -r '.metrics.totalRequests // 0')
            SUCCESS=$(echo "$BODY" | jq -r '.metrics.successfulRequests // 0')
            UNIQUE_IPS=$(echo "$BODY" | jq -r '.metrics.uniqueIPs // 0')
            
            MOVIES=$(echo "$BODY" | jq -r '.metrics.categories.movies // 0')
            SERIES=$(echo "$BODY" | jq -r '.metrics.categories.series // 0')
            RADIO=$(echo "$BODY" | jq -r '.metrics.categories.radio // 0')
            TV=$(echo "$BODY" | jq -r '.metrics.categories.tv // 0')
            
            LIFTW_REQ=$(echo "$BODY" | jq -r '.metrics.donors.liftwRequests // 0')
            LIFTW_FAIL=$(echo "$BODY" | jq -r '.metrics.donors.liftwFails // 0')
            GO_REQ=$(echo "$BODY" | jq -r '.metrics.donors.goRequests // 0')
            GO_FAIL=$(echo "$BODY" | jq -r '.metrics.donors.goFails // 0')
            
            ERRORS=$(echo "$BODY" | jq -r '.metrics.errors.total // 0')
            BANS=$(echo "$BODY" | jq -r '.metrics.errors.donorBans // 0')
            RL=$(echo "$BODY" | jq -r '.metrics.errors.rateLimits // 0')
            NF=$(echo "$BODY" | jq -r '.metrics.errors.notFounds // 0')
            INTERNAL=$(echo "$BODY" | jq -r '.metrics.errors.internal // 0')
            
            HOURS=$(($UPTIME / 3600))
            MINUTES=$((($UPTIME % 3600) / 60))
            
            # Calculate Success Rate %
            if [ "$TOTAL" -gt 0 ]; then
              SUCCESS_RATE=$(awk "BEGIN {printf \"%.1f\", ($SUCCESS / $TOTAL) * 100}")
            else
              SUCCESS_RATE="100.0"
            fi
            
            # Calculate Liftw Success %
            if [ "$LIFTW_REQ" -gt 0 ]; then
              LIFTW_SUCCESS_PCT=$(awk "BEGIN {printf \"%.1f\", (($LIFTW_REQ - $LIFTW_FAIL) / $LIFTW_REQ) * 100}")
            else
              LIFTW_SUCCESS_PCT="100.0"
            fi

            # Extract Recent Errors for 1-click copy block (HTML entity escaped to prevent Telegram 400 Bad Request)
            RECENT_ERRORS_RAW=$(echo "$BODY" | jq -r '.metrics.recentErrors[]? | "[\(.status)] \(.timestamp) \(.path) -> \(.message)"' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

            LOG_BLOCK=""
            if [ -n "$RECENT_ERRORS_RAW" ]; then
              LOG_BLOCK=$'\n\n📝 <b>Ошибки в логах (для передачи ИИ):</b>\n<code>\n'"${RECENT_ERRORS_RAW}"$'\n</code>'
            fi
            
            STATS_MSG="📊 <b>Сводка Media-Box (За 3 часа)</b>

          ⏳ <b>Аптайм:</b> ${HOURS}ч ${MINUTES}м
          👥 <b>Уникальных IP:</b> <b>${UNIQUE_IPS}</b>
          🌐 <b>Запросов:</b> <b>${TOTAL}</b> | ✅ <b>Успех:</b> <b>${SUCCESS_RATE}%</b>

          📊 <b>Активность по разделам:</b>
          🎬 Фильмы: ${MOVIES} | 📺 Сериалы: ${SERIES}
          📻 Радио: ${RADIO} | 📺 ТВ: ${TV}

          📡 <b>Диагностика доноров:</b>
          🏎 <b>Liftw (Плеер 1):</b> ${LIFTW_REQ} зап. | ${LIFTW_SUCCESS_PCT}% успех
          ⚡ <b>Anwap/Go (Плеер 2):</b> ${GO_REQ} зап. | ${GO_FAIL} сбоев

          📋 <b>Детализация проблем:</b>
          🔍 404 (Не найдено): ${NF} | 🚫 403 (Баны): ${BANS}
          🛑 429 (Лимиты): ${RL} | 🔥 500 (Ошибки парсера): ${INTERNAL}${LOG_BLOCK}"

            STATS_MSG=$(echo "$STATS_MSG" | sed 's/^[ \t]*//')
            echo "STATS_MSG<<EOF" >> $GITHUB_ENV
            echo "$STATS_MSG" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Send Telegram Notification
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MESSAGE="${ERROR_MSG:-$STATS_MSG}"
          TARGET_CHAT="${CHAT_ID:-484803732}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TARGET_CHAT" --arg text "$MESSAGE" '{chat_id: $chat_id, parse_mode: "HTML", text: $text}')"
