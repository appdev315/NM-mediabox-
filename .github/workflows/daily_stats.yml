name: 3-Hour Server Stats & Diagnostics

on:
  schedule:
    # Run every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC) -> 8 times per 24 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  send_stats:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Stats from API
        id: fetch_stats
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "DONOR_BLOCK=" >> $GITHUB_ENV
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${BOT_TOKEN}" https://evro90-nm6.hf.space/api/stats?reset=true)
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to fetch stats, status code: $HTTP_STATUS"
            echo "ERROR_MSG=⚠️ Не удалось получить статистику с сервера (Код $HTTP_STATUS)" >> $GITHUB_ENV
          else
            UPTIME=$(echo "$BODY" | jq -r '.uptime_seconds // 0')
            TOTAL=$(echo "$BODY" | jq -r '.metrics.totalRequests // 0')
            SUCCESS=$(echo "$BODY" | jq -r '.metrics.successfulRequests // 0')
            UNIQUE_IPS=$(echo "$BODY" | jq -r '.metrics.uniqueIPs // 0')
            
            MOVIES=$(echo "$BODY" | jq -r '.metrics.categories.movies // 0')
            SERIES=$(echo "$BODY" | jq -r '.metrics.categories.series // 0')
            RADIO=$(echo "$BODY" | jq -r '.metrics.categories.radio // 0')
            TV=$(echo "$BODY" | jq -r '.metrics.categories.tv // 0')
            ADULT=$(echo "$BODY" | jq -r '.metrics.categories.adult // 0')
            
            ERRORS=$(echo "$BODY" | jq -r '.metrics.errors.total // 0')
            BANS=$(echo "$BODY" | jq -r '.metrics.errors.donorBans // 0')
            RL=$(echo "$BODY" | jq -r '.metrics.errors.rateLimits // 0')
            NF=$(echo "$BODY" | jq -r '.metrics.errors.notFounds // 0')
            INTERNAL=$(echo "$BODY" | jq -r '.metrics.errors.internal // 0')
            
            HOURS=$(($UPTIME / 3600))
            MINUTES=$((($UPTIME % 3600) / 60))
            
            # Calculate Server Health Success Rate % (excluding 404 catalog misses)
            SERVER_ERRORS=$(($BANS + $RL + $INTERNAL))
            SERVER_TOTAL=$(($SUCCESS + $SERVER_ERRORS))
            if [ "$SERVER_TOTAL" -gt 0 ]; then
              SUCCESS_RATE=$(awk "BEGIN {printf \"%.1f%%\", ($SUCCESS / $SERVER_TOTAL) * 100}")
            else
              SUCCESS_RATE="—"
            fi

            # Extract Recent Errors for 1-click copy block (HTML entity escaped to prevent Telegram 400 Bad Request)
            RECENT_ERRORS_RAW=$(echo "$BODY" | jq -r '.metrics.recentErrors[]? | "[\(.status)] \(.timestamp) \(.path) -> \(.message)"' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

            LOG_BLOCK=""
            if [ -n "$RECENT_ERRORS_RAW" ]; then
              LOG_BLOCK=$'\n\n📝 <b>Ошибки в логах (для передачи ИИ):</b>\n<code>\n'"${RECENT_ERRORS_RAW}"$'\n</code>'
            fi
            
            STATS_MSG="📊 <b>Трафик стриминга — Go (за 3 часа)</b>

          ⏳ <b>Аптайм:</b> ${HOURS}ч ${MINUTES}м
          👥 <b>Уникальных IP:</b> <b>${UNIQUE_IPS}</b>
          🌐 <b>Запросов:</b> <b>${TOTAL}</b> | ✅ <b>Успех:</b> <b>${SUCCESS_RATE}</b>

          📊 <b>Активность по разделам:</b>
          🎬 Фильмы: ${MOVIES} | 📺 Сериалы: ${SERIES}
          📻 Радио: ${RADIO} | 📺 ТВ: ${TV}
          🍓 18+ (Адалт): ${ADULT}

          📋 <b>Детализация проблем:</b>
          🔍 404 (Не найдено): ${NF} | 🚫 403 (Баны): ${BANS}
          🛑 429 (Лимиты): ${RL} | 🔥 500 (Ошибки парсера): ${INTERNAL}${LOG_BLOCK}"

            STATS_MSG=$(echo "$STATS_MSG" | sed 's/^[ \t]*//')
            echo "STATS_MSG<<EOF" >> $GITHUB_ENV
            echo "$STATS_MSG" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Fetch Analytics Stats (Cloudflare D1)
        id: fetch_analytics
        env:
          STATS_KEY: ${{ secrets.BOT_TOKEN }}
        run: |
          ANALYTICS_RESP=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${STATS_KEY}" "https://backend.app-dev315.workers.dev/api/analytics/stats?windowHours=3")
          ANA_HTTP=$(echo "$ANALYTICS_RESP" | tail -n1)
          ANA_BODY=$(echo "$ANALYTICS_RESP" | sed '$d')

          if [ "$ANA_HTTP" -ne 200 ]; then
            echo "DONOR_BLOCK=" >> $GITHUB_ENV
            echo "ANALYTICS_BLOCK=" >> $GITHUB_ENV
            echo "PLAYBACK_BLOCK=" >> $GITHUB_ENV
            echo "RADIO_BLOCK=" >> $GITHUB_ENV
            exit 0
          fi

          # Real Donor Stats from Cloudflare Workers D1 (rate is null when no requests)
          CF_LIFTW_REQ=$(echo "$ANA_BODY" | jq -r '.donorStats.liftw.requests // 0')
          CF_LIFTW_RATE_RAW=$(echo "$ANA_BODY" | jq -r '.donorStats.liftw.rate // empty')
          CF_LIFTW_FAIL=$(echo "$ANA_BODY" | jq -r '.donorStats.liftw.fails // 0')

          if [ -z "$CF_LIFTW_RATE_RAW" ] || [ "$CF_LIFTW_RATE_RAW" = "null" ]; then
            CF_LIFTW_RATE_STR="нет данных"
          else
            CF_LIFTW_RATE_STR="${CF_LIFTW_RATE_RAW}% успех"
          fi
          DONOR_BLOCK="\n\n📡 <b>Диагностика доноров:</b>\n🏎 <b>Liftw (Плеер 1):</b> ${CF_LIFTW_REQ} зап. | ${CF_LIFTW_RATE_STR}"
          echo "DONOR_BLOCK<<EOF" >> $GITHUB_ENV
          echo -e "$DONOR_BLOCK" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          ACTIVE=$(echo "$ANA_BODY" | jq -r '.active.users // 0')
          SESSIONS=$(echo "$ANA_BODY" | jq -r '.active.sessions // 0')
          NEW_USERS=$(echo "$ANA_BODY" | jq -r '.newUsers // 0')

          # Top countries
          COUNTRIES_BLOCK=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            CNAME=$(echo "$line" | jq -r '.countryName // .country' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            CNT=$(echo "$line" | jq -r '.users')
            COUNTRIES_BLOCK="${COUNTRIES_BLOCK}\n  ${CNAME}: ${CNT}"
          done < <(echo "$ANA_BODY" | jq -c '.byCountry[]?' | head -5)
          [ -z "$COUNTRIES_BLOCK" ] && COUNTRIES_BLOCK="\n  Нет данных"

          # Top content (HTML-escaped titles to prevent Telegram 400 errors)
          CONTENT_BLOCK=""
          IDX=1
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            TITLE=$(echo "$line" | jq -r '.title' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            TYPE=$(echo "$line" | jq -r '.type')
            OPENS=$(echo "$line" | jq -r '.opens')
            CONTENT_BLOCK="${CONTENT_BLOCK}\n  ${IDX}. ${TITLE} (${TYPE}) — ${OPENS}"
            IDX=$((IDX+1))
          done < <(echo "$ANA_BODY" | jq -c '.topContent[]?' | head -6)
          [ -z "$CONTENT_BLOCK" ] && CONTENT_BLOCK="\n  Нет данных"

          ANALYTICS_BLOCK="\n\n📈 <b>Посетители — Cloudflare (3 часа):</b>\n👥 Активных: ${ACTIVE} | 📱 Сессий: ${SESSIONS} | 🆕 Новых: ${NEW_USERS}\n\n🌍 <b>Страны входа:</b>${COUNTRIES_BLOCK}\n\n🎬 <b>Топ контента:</b>${CONTENT_BLOCK}"

          echo "ANALYTICS_BLOCK<<EOF" >> $GITHUB_ENV
          echo -e "$ANALYTICS_BLOCK" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Client playback failures (cinema) from frontend telemetry
          PLAY_TOTAL=$(echo "$ANA_BODY" | jq -r '.playbackErrors.total // 0')
          PLAYBACK_LIST=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            PTITLE=$(echo "$line" | jq -r '.title // "—"' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            PTYPE=$(echo "$line" | jq -r '.type // "?"')
            PREASON=$(echo "$line" | jq -r '.reason // "error"')
            PCNT=$(echo "$line" | jq -r '.count')
            PLAYBACK_LIST="${PLAYBACK_LIST}\n  • ${PTITLE} (${PTYPE} — ${PREASON}) (${PCNT}x)"
          done < <(echo "$ANA_BODY" | jq -c '.playbackErrors.top[]?' | head -5)

          if [ "$PLAY_TOTAL" -gt 0 ]; then
            PLAYBACK_BLOCK="\n\n⚠️ <b>Сбои воспроизведения у клиентов (кино):</b> ${PLAY_TOTAL} шт.${PLAYBACK_LIST}"
          else
            PLAYBACK_BLOCK=""
          fi
          echo "PLAYBACK_BLOCK<<EOF" >> $GITHUB_ENV
          echo -e "$PLAYBACK_BLOCK" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Client radio/TV failures (separate block) from frontend telemetry
          RADIO_ERR_TOTAL=$(echo "$ANA_BODY" | jq -r '.radioErrors.total // 0')
          RADIO_ERR_LIST=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            RTITLE=$(echo "$line" | jq -r '.title // "—"' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            RTYPE=$(echo "$line" | jq -r '.type // "?"')
            RREASON=$(echo "$line" | jq -r '.reason // "error"')
            RCNT=$(echo "$line" | jq -r '.count')
            RADIO_ERR_LIST="${RADIO_ERR_LIST}\n  • ${RTITLE} (${RTYPE} — ${RREASON}) (${RCNT}x)"
          done < <(echo "$ANA_BODY" | jq -c '.radioErrors.top[]?' | head -5)

          if [ "$RADIO_ERR_TOTAL" -gt 0 ]; then
            RADIO_BLOCK="\n\n📻 <b>Сбои радио/ТВ у клиентов:</b> ${RADIO_ERR_TOTAL} шт.${RADIO_ERR_LIST}"
          else
            RADIO_BLOCK=""
          fi
          echo "RADIO_BLOCK<<EOF" >> $GITHUB_ENV
          echo -e "$RADIO_BLOCK" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Fetch Sysadmin Incidents (Cloudflare D1)
        id: fetch_incidents
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_API_KEY || 'mb_admin_sec_2026' }}
        run: |
          INC_RESP=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${ADMIN_KEY}" "https://backend.app-dev315.workers.dev/api/admin/incidents?windowHours=3")
          INC_HTTP=$(echo "$INC_RESP" | tail -n1)
          INC_BODY=$(echo "$INC_RESP" | sed '$d')

          if [ "$INC_HTTP" -ne 200 ]; then
            echo "INCIDENTS_BLOCK=" >> $GITHUB_ENV
            exit 0
          fi

          TOTAL_INC=$(echo "$INC_BODY" | jq -r '.total // 0')
          AUTO_FIXED=$(echo "$INC_BODY" | jq -r '.autoFixed // 0')
          UNRESOLVED=$(echo "$INC_BODY" | jq -r '.unresolved // 0')
          FIX_RATE_RAW=$(echo "$INC_BODY" | jq -r '.fixRate // empty')

          UNRESOLVED_LIST=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ITITLE=$(echo "$line" | jq -r '.title' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            ITYPE=$(echo "$line" | jq -r '.content_type')
            IFAIL=$(echo "$line" | jq -r '.fail_type')
            ICNT=$(echo "$line" | jq -r '.cnt')
            UNRESOLVED_LIST="${UNRESOLVED_LIST}\n  • ${ITITLE} (${ITYPE}) — ${IFAIL} (${ICNT}x)"
          done < <(echo "$INC_BODY" | jq -c '.topUnresolved[]?' | head -5)

          if [ "$TOTAL_INC" -gt 0 ]; then
            QUEUE_STR="\n\n⏳ <b>Не найдено на донорах:</b>${UNRESOLVED_LIST:-"\n  Нет"}"
          else
            QUEUE_STR=""
          fi

          if [ -z "$FIX_RATE_RAW" ] || [ "$FIX_RATE_RAW" = "null" ]; then
            FIX_STR="—"
          else
            FIX_STR="${FIX_RATE_RAW}%"
          fi

          INCIDENTS_BLOCK="\n\n🤖 <b>Системный администратор (за 3 часа):</b>\n🔍 Сбоев парсинга: <b>${TOTAL_INC}</b>\n🛠 Автоматически исправлено: <b>${AUTO_FIXED} (${FIX_STR})</b>\n⚠️ Нерешенных: <b>${UNRESOLVED}</b>${QUEUE_STR}"

          echo "INCIDENTS_BLOCK<<EOF" >> $GITHUB_ENV
          echo -e "$INCIDENTS_BLOCK" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send Telegram Notification
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MESSAGE="${ERROR_MSG:-$STATS_MSG}${DONOR_BLOCK}${ANALYTICS_BLOCK}${PLAYBACK_BLOCK}${RADIO_BLOCK}${INCIDENTS_BLOCK}"
          TARGET_CHAT="${CHAT_ID:-484803732}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TARGET_CHAT" --arg text "$MESSAGE" '{chat_id: $chat_id, parse_mode: "HTML", text: $text}')"

